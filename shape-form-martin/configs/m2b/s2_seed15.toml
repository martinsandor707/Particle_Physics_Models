# Track B (PLAN.md section 6). Stage 2 = the fine-tune that made mlp_std.pt: the equivalent of
# shapelab.fit_fast(steps=6000, lr=1e-3, lr_end=1e-4) at batch 256, K=16, best validation state kept
# (sfm.train docstring: k_train=16, k_val=16, selection="best_val", fold_rng="global", eval_every=250).
# Run: uv run python -B shape-form-martin/scripts/run_m2b_fit.py shape-form-martin/configs/m2b/<this file>

[run]
name = "s2_seed15"
stage = "m2b_mlp"
seed = 15
notes = "Track B stage 2: fine-tune of the stage-1 network s1_seed15 (report recipe, seed 15) with the fit_fast schedule"

[model]
factory = "from_run"
run = "m2b_mlp/s1_seed15"

[fit]
steps = 6000
lr = 1e-3
lr_end = 1e-4
batch = 256
k_train = 16
fold = "iid"
k_val = 16
eval_every = 250
selection = "best_val"
fold_rng = "global"
smooth = 0.0
weight_decay = 0.0
ckpt_every = 250

[evaluate]
registry = true
guards = true
